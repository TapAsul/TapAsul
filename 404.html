<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0881ef">
<title>Page not found — TapAsul</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
<style>
  .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; }
  .nf__inner { max-width: 520px; }
  .nf__code { font-size: clamp(4rem, 18vw, 8rem); line-height: 1; font-weight: 700; color: var(--brand); letter-spacing: -.04em; }
  .nf h1 { font-size: 1.5rem; margin: 8px 0 12px; }
  .nf p { color: var(--text-muted); margin: 0 0 28px; }
  .nf__actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .nf__mark { margin-bottom: 20px; }
</style>
</head>
<body>
  <main class="nf">
    <div class="nf__inner">
      <img class="nf__mark" src="assets/logo-frog.svg" alt="TapAsul" width="56" height="50">
      <div class="nf__code">404</div>
      <h1>We couldn't find that page</h1>
      <p>The link may be broken or the page may have moved. Everything else on the site is still where you left it.</p>
      <div class="nf__actions">
        <a class="btn btn--primary btn--lg" href="/">Back to the home page</a>
        <a class="btn btn--ghost btn--lg" href="/#products">See products &amp; pricing</a>
      </div>
    </div>
  </main>
</body>
</html>
