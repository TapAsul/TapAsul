<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects | TapAsul</title>
<meta name="description" content="TapAsul projects: NFC digital cards, acrylic QR standees, and client moments.">
<meta property="og:type" content="website">
<meta property="og:title" content="TapAsul | Digital Storefronts, NFC Cards & Automation">
<meta property="og:description" content="Tap once. Connect instantly. NFC digital cards and custom web solutions by TapAsul.">
<meta property="og:image" content="assets/back.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
:root{
  --bg:#0a0f1d; --glass:rgba(255,255,255,.05); --glass-b:rgba(255,255,255,.12);
  --text:#f1f5f9; --muted:#94a3b8;
  --blue:#3b82f6; --blue2:#1a73e8;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit}
img{display:block;max-width:100%}
.wrap{width:min(1120px,92%);margin:0 auto}
section{padding:clamp(72px,11vw,130px) 0;position:relative}
.eyebrow{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--blue);font-weight:700;margin-bottom:14px}
h1,h2,h3{line-height:1.1;font-weight:800}
h1{font-size:clamp(2.4rem,7vw,5.5rem);letter-spacing:-.03em}
h2{font-size:clamp(2rem,5vw,3.2rem);letter-spacing:-.02em;margin-bottom:16px}
.muted{color:var(--muted)}
.accent{background:linear-gradient(120deg,var(--blue),#60a5fa);-webkit-background-clip:text;background-clip:text;color:transparent}
.glass{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:20px}

/* Glass nav */
header{position:fixed;top:12px;left:0;right:0;z-index:50}
.nav{display:flex;justify-content:space-between;align-items:center;height:64px;padding:0 22px;background:rgba(10,15,29,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-b);border-radius:18px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem}
.logo img{height:40px;width:auto;border-radius:6px}
.navlinks{display:flex;gap:24px;list-style:none}
.navlinks a{color:var(--muted);font-size:.95rem;transition:color .2s;min-height:44px;display:inline-flex;align-items:center}
.navlinks a:hover{color:var(--text)}
.menu-btn{display:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--glass-b);background:var(--glass);color:var(--text);font-size:1.2rem;cursor:pointer}
@media(max-width:820px){
  .navlinks{position:absolute;top:72px;left:0;right:0;flex-direction:column;gap:0;background:rgba(10,15,29,.96);border-radius:18px;border:1px solid var(--glass-b);max-height:0;overflow:hidden;transition:max-height .35s var(--ease)}
  .navlinks.open{max-height:360px}
  .navlinks a{display:flex;padding:0 22px;width:100%}
  .menu-btn{display:inline-flex;align-items:center;justify-content:center}
}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:999px;font-weight:700;border:1px solid var(--glass-b);background:var(--glass);color:var(--text);cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s,border-color .25s}
.btn:hover{transform:translateY(-2px);border-color:var(--blue)}
.btn-primary{background:linear-gradient(120deg,var(--blue2),var(--blue));border-color:transparent;color:#fff;box-shadow:0 10px 30px -12px var(--blue2)}
.btn-primary:hover{box-shadow:0 14px 40px -10px var(--blue2)}

/* Hero */
.hero{min-height:100vh;display:flex;align-items:center;padding-top:120px}
.hero .sub{font-size:clamp(1.05rem,2vw,1.3rem);color:var(--muted);max-width:620px;margin:22px 0 34px}
.hero-stats{display:flex;flex-wrap:wrap;gap:26px;margin-top:50px}
.hero-stats div{padding:14px 20px}
.hero-stats strong{display:block;font-size:1.5rem;color:var(--blue)}
.hero-stats span{color:var(--muted);font-size:.9rem}

/* Reveal */
.reveal{opacity:0;transform:translateY(34px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.reveal.in{opacity:1;transform:none}

/* 3D background card layer */
#cardLayer{position:fixed;inset:0;pointer-events:none;z-index:5;perspective:1100px}
#cardPos{position:absolute;left:0;top:0;transform:translate3d(-50%,-50%,0);will-change:transform,opacity}
#card3d{width:320px;height:202px;position:relative;transform-style:preserve-3d}
#card3d.tap{animation:tapPulse .55s var(--ease)}
@keyframes tapPulse{0%{transform:translateZ(0)}40%{transform:translateZ(-24px)}100%{transform:translateZ(0)}}
.face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 22px 50px -18px rgba(0,0,0,.6)}
.face img{width:100%;height:100%;object-fit:cover}
.back{transform:rotateY(180deg)}

/* Projects */
.svc-grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:40px}
.svc{padding:30px;transition:transform .45s var(--ease),border-color .3s,box-shadow .45s}
.svc:hover{transform:translateY(-6px);border-color:rgba(59,130,246,.5);box-shadow:0 24px 50px -24px rgba(59,130,246,.5)}
.svc .ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:rgba(59,130,246,.15);color:var(--blue);font-size:1.4rem;margin-bottom:16px}
.svc p{color:var(--muted);font-size:.95rem;margin-bottom:14px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:.78rem;padding:4px 11px;border-radius:999px;border:1px solid var(--glass-b);color:var(--muted);background:rgba(255,255,255,.03)}
.projects{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:40px}
.project{padding:28px;display:flex;flex-direction:column;gap:12px;transition:transform .45s var(--ease),border-color .3s}
.project:hover{transform:translateY(-6px);border-color:rgba(59,130,246,.5)}
.project .thumb{aspect-ratio:16/9;border-radius:14px;display:grid;place-items:center;font-size:2.8rem;background:linear-gradient(135deg,#1e3a8a,#0f172a);border:1px solid var(--glass-b)}
.project h3{font-size:1.25rem}
.project p{color:var(--muted);font-size:.95rem}
.project .links{margin-top:auto;display:flex;gap:10px;flex-wrap:wrap}
.project .links .btn{min-height:44px;font-size:.92rem;padding:0 16px}

/* Phone section */
#tap{background:linear-gradient(180deg,transparent,rgba(59,130,246,.08) 60%,transparent)}
.tap-grid{display:grid;gap:50px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:center}
.phone-wrap{display:flex;justify-content:center}
.phone{width:290px;height:580px;border-radius:44px;padding:12px;background:linear-gradient(145deg,#334155,#0b1222);box-shadow:0 40px 80px -30px rgba(0,0,0,.8),inset 0 0 0 2px #1e293b;position:relative}
.screen{width:100%;height:100%;border-radius:34px;background:#070b16;position:relative;overflow:hidden}
.sensor{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:96px;height:26px;border-radius:999px;background:#000;z-index:4;display:flex;align-items:center;justify-content:center}
.sensor::after{content:"";width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,#1a73e8,#0b2a5c);box-shadow:0 0 10px rgba(59,130,246,.7);transition:box-shadow .3s}
.phone.scan .sensor::after,.phone.open .sensor::after{box-shadow:0 0 22px #3b82f6,0 0 40px #22c55e}
.ripple{position:absolute;left:50%;top:31px;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:2px solid rgba(34,197,94,.9);opacity:0;pointer-events:none;z-index:3}
.phone.scan .ripple{animation:ripple 1.2s var(--ease) 2}
.phone.scan .ripple:nth-child(2){animation-delay:.35s}
.phone.scan .ripple:nth-child(3){animation-delay:.7s}
@keyframes ripple{0%{transform:scale(.5);opacity:.9}100%{transform:scale(7);opacity:0;border-color:rgba(59,130,246,0)}}

/* Lock screen */
.lock{position:absolute;inset:0;padding:70px 24px 30px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .5s var(--ease),transform .5s var(--ease)}
.lock .clock{font-size:3rem;font-weight:300;color:#e2e8f0;letter-spacing:-.02em}
.lock .hint{margin-top:18px;color:var(--muted);font-size:.9rem;max-width:200px}
.lock .hint b{color:var(--text)}
.lock .wave{margin-top:26px;width:70px;height:70px;border-radius:50%;border:1px solid rgba(59,130,246,.35);display:grid;place-items:center;font-size:1.6rem;animation:breathe 2.4s var(--ease) infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,.35)}50%{box-shadow:0 0 0 14px rgba(59,130,246,0)}}
.phone.scan .lock,.phone.open .lock{opacity:0;transform:scale(.96)}

/* Reader (loading step after the tap) */
.frog-load{position:relative;width:110px;height:100px;margin:0 auto}
.frog-load svg{width:100%;height:100%;overflow:visible}
.frog-load .frog-hop{transform-box:fill-box;transform-origin:50% 100%;animation:frogHop .9s ease-in-out infinite}
@keyframes frogHop{0%,100%{transform:translateY(0) scaleY(1)}20%{transform:translateY(0) scaleY(.85)}50%{transform:translateY(-12px) scaleY(1.05)}75%{transform:translateY(0) scaleY(.95)}}
.frog-load .tongue{transform-box:view-box;transform-origin:50px 30px;animation:tongueFlick .9s ease-in-out infinite}
@keyframes tongueFlick{0%,40%{transform:scaleY(0)}55%,70%{transform:scaleY(1)}85%,100%{transform:scaleY(0)}}
.frog-load .fly{animation:flyBlink .9s ease-in-out infinite}
@keyframes flyBlink{0%,100%{opacity:.25}55%{opacity:1}}
.reader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;transition:opacity .3s var(--ease);z-index:2;pointer-events:none}
.phone.scan .reader{opacity:1}
.loader{position:relative;width:76px;height:76px}
.loader .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0deg,#1a73e8 120deg,#22c55e 300deg,transparent 360deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));animation:spin 1s linear infinite}
.loader .orbit{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px #22c55e;animation:orbit 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes orbit{from{transform:rotate(0deg) translateX(33px) rotate(0deg)}to{transform:rotate(360deg) translateX(33px) rotate(-360deg)}}
.reader p{color:#86efac;font-size:.9rem;font-weight:700;letter-spacing:.04em}

/* Profile (opens after the read) */
.profile{position:absolute;inset:0;padding:108px 16px 16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;scrollbar-width:none;opacity:0;transform:translateY(40px);pointer-events:none;transition:opacity .6s var(--ease),transform .6s var(--ease);background:linear-gradient(180deg,#0f1a33,#070b16);z-index:1}
.profile::-webkit-scrollbar{display:none}
.phone.open .profile{opacity:1;transform:none;pointer-events:auto}
.p-top{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.p-top img{height:24px;width:auto}
.p-top span{font-size:.7rem;color:#86efac;font-weight:700;letter-spacing:.06em}
.p-card{background:rgba(255,255,255,.06);border:1px solid var(--glass-b);border-radius:20px;padding:14px;flex-shrink:0}
.p-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.av{width:48px;height:48px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--blue2),#22c55e);display:grid;place-items:center;font-weight:800;font-size:1.15rem}
.p-head h4{font-size:1rem;line-height:1.2}
.p-head .role{color:var(--muted);font-size:.72rem;line-height:1.35;margin-top:2px}
.p-list{display:grid;gap:6px}
.p-list a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--glass-b);font-size:.74rem}
.p-list a span:first-child{color:var(--muted);flex:0 0 auto}
.p-list a span:last-child{color:var(--text);font-weight:600;text-align:right;word-break:break-all;min-width:0}
.p-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex-shrink:0}
.p-actions a{min-height:42px;line-height:42px;text-align:center;border-radius:12px;background:rgba(59,130,246,.18);border:1px solid rgba(59,130,246,.35);font-weight:600;font-size:.85rem}
.p-actions a.primary{grid-column:1/-1;background:var(--blue2);border-color:transparent}
.p-note{font-size:.62rem;color:var(--muted);text-align:center;flex-shrink:0}
.phone-caption{margin-top:14px;text-align:center;font-size:.85rem;color:var(--muted)}
.phone-caption button{background:none;border:none;color:var(--blue);cursor:pointer;font-weight:600;min-height:44px;padding:0 6px}

/* Projects: 3D card globe */
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.globe-stage{--tw:250px;--th:330px;height:560px;position:relative;overflow:hidden;margin-top:8px}
.tile.photo{cursor:zoom-in;padding:0;border-radius:14px}
.photo-box{position:fixed;inset:0;z-index:9999;background:rgba(3,7,18,.92);display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.photo-box.open{display:flex}
.photo-box img{max-width:100%;max-height:100%;border-radius:14px;box-shadow:0 0 40px rgba(59,130,246,.35)}
.photo-box button{position:absolute;top:14px;right:18px;background:none;border:0;color:#fff;font-size:2rem;cursor:pointer;line-height:1}
.globe{position:absolute;left:50%;top:50%;width:0;height:0}
.tile{position:absolute;left:0;top:0;will-change:transform;width:var(--tw);height:var(--th);border-radius:12px;border:1px solid rgba(96,165,250,.45);background:linear-gradient(135deg,#1e3a8a,#0f172a);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:12px;color:#fff;overflow:hidden;box-shadow:0 0 22px rgba(59,130,246,.18);text-decoration:none}
.tile .emo{font-size:1.6rem;line-height:1}
.tile strong{font-size:.92rem;margin-top:8px;line-height:1.2}
.tile small{color:#94a3b8;font-size:.7rem;margin-top:3px}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile:hover{border-color:var(--blue)}
.globe-hint{text-align:center;font-size:.85rem;margin-top:8px}
@media (max-width:820px){
  .globe-stage{--tw:150px;--th:200px;height:400px}
  .tile{padding:8px}
  .tile .emo{font-size:1rem}
  .tile strong{font-size:.7rem;margin-top:4px}
  .tile small{display:none}
}

/* Footer */
footer{border-top:1px solid var(--glass-b);padding:34px 0;color:var(--muted);font-size:.92rem;position:relative;z-index:6;background:var(--bg)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px}
footer .brand{display:flex;align-items:center;gap:10px}
footer .brand img{height:32px;width:auto}
footer .socials{display:flex;gap:10px}
footer .socials a{min-height:44px;display:inline-flex;align-items:center;padding:0 14px;border-radius:12px;border:1px solid var(--glass-b);background:var(--glass)}
footer .socials a:hover{border-color:var(--blue);color:var(--text)}

/* Contact */
.contact-form{padding:30px;display:grid;gap:14px;max-width:560px}
.field label{display:block;font-size:.88rem;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;min-height:48px;padding:12px 14px;border-radius:12px;border:1px solid var(--glass-b);background:rgba(255,255,255,.04);color:var(--text);font:inherit}
.field select option{background:#0f172a}
.field textarea{min-height:120px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue)}
.status{min-height:1.4em;color:#86efac;font-size:.92rem}

.socials-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;max-width:680px;margin:0 auto}
.soc{min-height:56px;display:flex;align-items:center;justify-content:center;font-weight:600;transition:transform .25s var(--ease),border-color .25s}
.soc:hover{transform:translateY(-3px);border-color:var(--blue)}
/* Fireflies + frog */
#fireflies{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.frog-strip{position:relative;height:150px;background:transparent;overflow:hidden}
.frog-strip canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.frog-score{position:absolute;top:12px;left:20px;font-size:.85rem;color:var(--muted);z-index:1;pointer-events:none}
.feat{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:8px}
.feat li{position:relative;padding-left:24px;color:var(--muted);font-size:.9rem;line-height:1.45}
.feat li::before{content:"✓";position:absolute;left:0;top:0;color:#22c55e;font-weight:700}
/* Frog: hidden sensor (still used for the card lock) and moving eyes */
.sensor{background:transparent!important;box-shadow:none!important}
.sensor::after{display:none!important}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}

@media (max-width:820px){
  #card3d{width:240px;height:152px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .reveal{opacity:1;transform:none}
}
/* Frog phone */
.phone{width:380px;height:460px;padding:0;border-radius:0;background:none;box-shadow:none;position:relative;margin:0 auto}
.frog-shell{position:absolute;inset:0;width:100%;height:100%;z-index:1;filter:drop-shadow(0 30px 40px rgba(0,0,0,.6))}
.screen{position:absolute;left:50%;top:132px;width:290px;height:300px;transform:translateX(-50%);border-radius:24px;background:#070b16;border:2px solid rgba(96,165,250,.5);box-shadow:0 0 30px rgba(59,130,246,.25);overflow:hidden;z-index:2}
.sensor{position:absolute;top:62px;left:50%;transform:translateX(-50%);width:56px;height:22px;z-index:4}
.ripple{position:absolute;left:50%;top:73px;margin:-20px 0 0 -20px;z-index:3}
.profile{padding:14px 12px 12px;gap:8px}
@media (max-width:500px){
  .phone{transform:scale(.78);transform-origin:top center;margin-bottom:-90px}
}

#tap .tap-grid{gap:90px}
#tap .tap-grid > div:first-child{padding-right:20px}
#tap .eyebrow{margin-bottom:20px}
#tap h2{line-height:1.22;margin-bottom:30px}
#tap p.muted{line-height:1.8}
#tap .btn{margin-top:14px}
.phone.near .frog-shell{filter:drop-shadow(0 0 24px rgba(34,197,94,.7))}
</style>
<style>
.page-hero{padding:150px 0 30px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0 34px}
.chip{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--glass-b);background:var(--glass);color:var(--muted);font-weight:600;cursor:pointer;transition:all .25s var(--ease)}
.chip:hover,.chip.on{color:#fff;border-color:var(--blue);background:rgba(59,130,246,.18)}
.gallery{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.shot{margin:0;border-radius:16px;overflow:hidden;border:1px solid var(--glass-b);background:var(--glass);transition:transform .45s var(--ease),border-color .3s,box-shadow .45s}
.shot:hover{transform:translateY(-6px);border-color:rgba(59,130,246,.5);box-shadow:0 24px 50px -24px rgba(59,130,246,.5)}
.shot-btn{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}
.shot-btn img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.shot figcaption{padding:14px 16px 16px;font-weight:600}
.shot .cat{display:block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin-bottom:4px}
.shot[hidden]{display:none}
.back-link{display:inline-block;margin-top:40px}
.photo-box{position:fixed;inset:0;z-index:9999;background:rgba(3,7,18,.92);display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.photo-box.open{display:flex}
.photo-box img{max-width:100%;max-height:100%;border-radius:14px;box-shadow:0 0 40px rgba(59,130,246,.35)}
.photo-box button{position:absolute;top:14px;right:18px;background:none;border:0;color:#fff;font-size:2rem;cursor:pointer;line-height:1}
</style>
</head>
<body>

<header>
  <nav class="nav wrap" aria-label="Main navigation" style="width:min(1120px,92%)">
    <a href="index.html#top" class="logo"><img src="assets/logo.png" alt="TapAsul"></a>
    <ul class="navlinks" id="navlinks">
      <li><a href="index.html#services">Services</a></li>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  // filter by category
  const chips = document.querySelectorAll('.chip');
  const shots = document.querySelectorAll('.shot');
  chips.forEach(chip => chip.addEventListener('click', () => {
    chips.forEach(c => c.classList.toggle('on', c === chip));
    const cat = chip.dataset.cat;
    shots.forEach(s => s.hidden = !(cat === 'All' || s.dataset.cat === cat));
  }));

  // full-size photo
  const box = document.getElementById('photoBox');
  const boxImg = box.querySelector('img');
  document.querySelectorAll('.shot-btn').forEach(b => b.addEventListener('click', () => {
    boxImg.src = b.dataset.src;
    box.classList.add('open');
  }));
  box.addEventListener('click', () => box.classList.remove('open'));
  addEventListener('keydown', e => { if (e.key === 'Escape') box.classList.remove('open'); });

  // mobile menu, if the header includes one
  const menuBtn = document.getElementById('menuBtn');
  const navlinks = document.getElementById('navlinks');
  if (menuBtn && navlinks) menuBtn.addEventListener('click', () => {
    const open = navlinks.classList.toggle('open');
    menuBtn.setAttribute('aria-expanded', open);
  });
</script>
